<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ML Path — Offline Bangla-first ML Engineering Companion">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ML Path">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ML Path — Offline ML Engineering Companion (বাংলা)</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background: #F7F8F5;
      color: #163024;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #mlpath-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    .mlpath-badge {
      background: #164A35;
      color: #D9EDAA;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.8px;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .mlpath-title {
      font-size: 26px;
      font-weight: 800;
      margin: 0;
    }
    .mlpath-sub {
      font-size: 13px;
      color: #4D6257;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="mlpath-splash">
    <div class="mlpath-badge">ML PATH · 6 BOOKS · 880 LESSONS</div>
    <h1 class="mlpath-title">ML Path</h1>
    <p class="mlpath-sub">Loading your offline ML Engineering notebook…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
